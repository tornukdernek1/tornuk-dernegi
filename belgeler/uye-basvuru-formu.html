<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Üyelik Başvuru Formu</title>
    <style>
      body {
        font-family: Georgia, serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1.25rem 3rem;
        line-height: 1.6;
        color: #14221f;
      }
      label {
        display: block;
        margin: 1rem 0 0.35rem;
        font-weight: 700;
      }
      input,
      textarea {
        width: 100%;
        padding: 0.65rem;
        border: 1px solid #c5d0cb;
        border-radius: 8px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Üyelik Başvuru Formu</h1>
    <p><em>Örnek form — yazdırıp doldurabilir veya gerçek PDF ile değiştirebilirsiniz.</em></p>
    <label>Ad Soyad</label>
    <input />
    <label>T.C. Kimlik No</label>
    <input />
    <label>Telefon</label>
    <input />
    <label>Adres</label>
    <textarea rows="3"></textarea>
    <label>İmza / Tarih</label>
    <input />
  </body>
</html>
